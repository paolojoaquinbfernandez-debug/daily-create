<link rel="manifest" id="manifest">
<style>
:root{
  --bg:#1c1512; --bg2:#251c18; --card:#2b211c; --card2:#33271f; --line:#3d2f26;
  --text:#fbefe4; --muted:#bfa998; --faint:#8a7566;
  --accent:#ff9f5a; --accent2:#e8594a; --draw:#ffa86b; --write:#8fc6b8; --both:#e7b8ff; --rest:#a9b4c9;
  --ok:#9fd38a; --shadow:0 10px 30px rgba(0,0,0,.35);
  --r:22px;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#fbf4ec; --bg2:#f4e9dd; --card:#fffaf5; --card2:#f7ece1; --line:#ead9c8;
    --text:#2a1d15; --muted:#7a6250; --faint:#a28d7c; --accent:#e9752c; --accent2:#d4443a;
    --draw:#d97629; --write:#2f8a75; --both:#9a4fc4; --rest:#5b6a86; --ok:#3f8f2e; --shadow:0 8px 24px rgba(90,50,20,.12); }
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 28px);
  min-height:100vh; -webkit-font-smoothing:antialiased;
  background:radial-gradient(120% 60% at 50% -10%, color-mix(in srgb,var(--accent) 14%,transparent), transparent 60%), var(--bg)}
main{max-width:520px;margin:0 auto}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;margin:2px 4px 14px}
.brand{font-weight:700;letter-spacing:.2px;font-size:15px;color:var(--muted)}
.brand b{color:var(--text)}
.streak{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-weight:700;font-size:15px}
.streak small{font-weight:500;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;margin-bottom:14px}
.today-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dayname{font-size:34px;font-weight:800;letter-spacing:-.5px;line-height:1.05}
.date{color:var(--muted);font-size:14px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;letter-spacing:.4px;text-transform:uppercase;padding:6px 11px;border-radius:999px;
  background:color-mix(in srgb,var(--m) 18%,transparent);color:var(--m);border:1px solid color-mix(in srgb,var(--m) 35%,transparent);white-space:nowrap}
.m-draw{--m:var(--draw)} .m-write{--m:var(--write)} .m-both{--m:var(--both)} .m-rest{--m:var(--rest)}
.headline{font-size:19px;font-weight:650;margin:14px 0 2px;line-height:1.3}
.step{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
.steplabel{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.steplabel .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--card2);color:var(--text);font-size:12px}
.steplabel.on{color:var(--accent)} .steplabel.on .n{background:var(--accent);color:#1c1512}
.steptext{margin:8px 0 0;font-size:16px}
.pick{margin-top:10px;background:var(--card2);border-radius:14px;padding:12px 14px;font-size:15px}
.pick b{display:block;font-size:17px}
.pick span{color:var(--muted);font-size:14px}
.pick ol{margin:6px 0 0;padding-left:20px}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:62px;margin-top:14px;border-radius:18px;font-size:19px;font-weight:750;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;text-decoration:none;box-shadow:0 8px 22px color-mix(in srgb,var(--accent2) 35%,transparent);transition:transform .08s}
.big:active{transform:scale(.98)}
.big .arrow{font-size:20px;opacity:.9}
.sub{color:var(--muted);font-size:13px;text-align:center;margin-top:8px}
/* timer */
.timer{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:112px;height:112px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .t b{font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:-.5px;display:block}
.ring .t small{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.tctl{flex:1;display:flex;flex-direction:column;gap:8px}
.tphase{font-weight:700;font-size:16px}
.tdesc{color:var(--muted);font-size:14px;margin-top:-4px}
.row{display:flex;gap:8px}
.btn{flex:1;min-height:46px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:16px}
.btn.primary{background:var(--text);color:var(--bg);border-color:transparent}
.btn:active{transform:scale(.98)}
/* done */
.done{width:100%;min-height:60px;border-radius:18px;font-size:18px;font-weight:800;background:var(--card2);border:2px solid var(--ok);color:var(--ok)}
.done.is-done{background:var(--ok);color:#16210f}
.note{width:100%;margin-top:10px;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:12px 14px;font:inherit;font-size:16px}
.note::placeholder{color:var(--faint)}
.undo{display:block;margin:8px auto 0;color:var(--muted);font-size:13px;text-decoration:underline}
.hist{display:flex;justify-content:space-between;margin-top:16px}
.hd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex:1}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:800}
.dot.ok{background:var(--ok);border-color:var(--ok);color:#16210f}
.dot.rest{border-style:dashed}
.dot.today{border-color:var(--accent)}
.hd.today{color:var(--text);font-weight:700}
.peek{width:100%;min-height:52px;border-radius:16px;background:transparent;border:1px solid var(--line);font-weight:700;color:var(--muted)}
.rule{text-align:center;color:var(--faint);font-size:13px;font-style:italic;margin:22px 8px 0;letter-spacing:.2px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--bg2);border-radius:24px 24px 0 0;border-top:1px solid var(--line);
  padding:10px 16px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(105%);visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s;z-index:11;-webkit-overflow-scrolling:touch}
.sheet.open{transform:none;visibility:visible;transition:transform .25s ease,visibility 0s}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet h2{margin:0 4px 12px;font-size:22px;display:flex;justify-content:space-between;align-items:center}
.sheet h2 button{font-size:15px;color:var(--muted);font-weight:600}
.wd{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.wd.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.wd .h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wd .h b{font-size:17px}
.wd .h .d{color:var(--muted);font-size:13px;font-weight:500;margin-left:6px}
.wd p{margin:6px 0 0;font-size:14px;color:var(--muted)}
.wd p strong{color:var(--text);font-weight:600}
.wd .mine{margin-top:8px;font-size:14px;padding:8px 10px;border-radius:10px;background:var(--card2)}
.ck{color:var(--ok);font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,30px);opacity:0;background:var(--text);color:var(--bg);
  padding:12px 18px;border-radius:14px;font-weight:700;transition:.25s;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

<main>
  <div class="top">
    <div class="brand"><b>10 in</b>, 20 out</div>
    <div class="streak" id="streak" aria-label="streak">🔥 <span id="streakN">0</span> <small id="streakL">days</small></div>
  </div>

  <section class="card" id="today"></section>

  <section class="card" id="timerCard">
    <div class="timer">
      <div class="ring">
        <svg width="112" height="112" viewBox="0 0 112 112"><circle cx="56" cy="56" r="48" fill="none" stroke="var(--line)" stroke-width="9"/>
          <circle id="arc" cx="56" cy="56" r="48" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round" stroke-dasharray="301.6" stroke-dashoffset="301.6"/></svg>
        <div class="t"><div><b id="tTime">10:00</b><small id="tSmall">input</small></div></div>
      </div>
      <div class="tctl">
        <div class="tphase" id="tPhase">Ready when you are</div>
        <div class="tdesc" id="tDesc">10 min input, then 20 min making.</div>
        <div class="row"><button class="btn primary" id="tStart">Start</button><button class="btn" id="tReset" hidden>Reset</button></div>
      </div>
    </div>
  </section>

  <section class="card" id="doneCard">
    <input class="note" id="note" maxlength="140" autocomplete="off">
    <div style="height:10px"></div>
    <button class="done" id="doneBtn">Done today</button>
    <button class="undo" id="undoBtn" hidden>undo</button>
    <div class="hist" id="hist"></div>
  </section>

  <button class="peek" id="peekBtn">Peek at the whole week</button>
  <p class="rule">Finish something every day, even if rough.</p>
</main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="This week">
  <div class="grab"></div>
  <h2><span id="sheetTitle">This week</span><button id="closeSheet">Close</button></h2>
  <div id="week"></div>
</div>

/* ---------- date helpers (device-local) ---------- */
function now(){ return new Date(); }
function pad(n){ return (n<10?"0":"")+n; }
function keyOf(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function addDays(d,n){ var x=new Date(d.getFullYear(), d.getMonth(), d.getDate()+n, 12); return x; }
function noon(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12); }
function mondayOf(d){ var dow=(d.getDay()+6)%7; return addDays(d,-dow); }
function weekIndex(d){ var m=mondayOf(d); return Math.floor(Date.UTC(m.getFullYear(),m.getMonth(),m.getDate())/864e5/7); }
function hash(s){ var h=2166136261>>>0; for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } return h>>>0; }
function pick(list, d, salt){ return list[hash(keyOf(d)+"|"+salt)%list.length]; }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }

function planFor(d){
  var dow=d.getDay(), p={dow:dow, date:d};
  if(dow===1){
    p.mode="draw"; p.title="Gesture → anime";
    p.input="Open Line of Action and draw the random pose it gives you. Don't pick, just take the first one.";
    p.btn="Open Line of Action"; p.url="https://line-of-action.com/practice-tools/app/figure-drawing";
    p.output="Redraw that same pose as an anime character. Keep the gesture line; add hair, costume, a face.";
    p.notePh="Who did the pose become? (optional)";
  } else if(dow===2){
    p.mode="write"; p.title="Random Wikipedia scene";
    p.input="Hit Random article on Wikipedia. Whatever comes up is your topic, no rerolls.";
    p.btn="Random Wikipedia article"; p.url="https://en.wikipedia.org/wiki/Special:Random";
    p.output="Write a short scene where that topic really matters to a character. Dialogue welcome. Stop when the timer does.";
    p.notePh="Which article did you get? (optional)";
  } else if(dow===3){
    var mg=pick(MANGA,d,"manga"); p.manga=mg;
    p.mode="draw"; p.title="Copy a panel: "+mg.t;
    p.input="Find one panel from "+mg.t+" and copy it as closely as you can. First panel you like wins.";
    p.btn="Find a "+mg.t+" panel"; p.url="https://www.google.com/search?tbm=isch&q="+encodeURIComponent(mg.t+" manga panel");
    p.pickHtml="<b>"+esc(mg.t)+"</b><span>"+esc(mg.a)+" · "+esc(mg.s)+"</span>";
    p.output="Draw your own character in that same style: same line weight, same eyes, same shading.";
    p.notePh="Which panel did you copy? (optional)";
  } else if(dow===4){
    var r=pick(READS,d,"read"); p.read=r;
    p.mode="write"; p.title="Read & respond";
    p.input="Read one short "+(r.k==="story"?"story":"essay")+": "+r.t+" by "+r.a+" (~"+r.m+" min).";
    p.btn="Read “"+r.t+"”"; p.url=r.u;
    p.pickHtml="<b>"+esc(r.t)+"</b><span>"+esc(r.a)+" · "+(r.k==="story"?"short story":"essay")+" · ~"+r.m+" min read</span>";
    p.output = r.k==="story"
      ? "Write a response: retell the key moment from another character's view, or write what happens the next morning."

    p.notePh="One line you liked? (optional)";
  } else if(dow===5){
    var hands = weekIndex(d)%2!==0; p.drill = hands?"hands":"expressions";

    p.url="https://line-of-action.com/practice-tools/app/"+(hands?"hands-feet":"faces-expressions");
    p.pickHtml="<b>Draw 6 "+(hands?"hands":"expressions")+":</b><ol>"+set.map(function(x){return "<li>"+esc(x)+"</li>";}).join("")+"</ol>";
    p.output="Put them on an original character: one sheet, your OC, at least 3 of today's "+(hands?"hands":"expressions")+".";
    p.notePh="Which one was hardest? (optional)";
    p.alt = hands ? "Next Friday: expressions." : "Next Friday: hands.";
  } else if(dow===6){
    p.mode="both"; p.title="Illustrate your own words";
    p.input="Reread what you wrote this week (Tuesday's scene and Thursday's response). Choose the first moment you can see.";
    p.btn="Reread this week"; p.sheet=true;
    p.output="Illustrate that moment as a single anime panel or a small comic strip. Rough is fine.";
    p.notePh="Which moment did you draw? (optional)";
  } else {

    p.output="Nothing required. If you're flipping through, circle one thing you'd like to do again.";
    p.notePh="Anything you noticed? (optional)";
  }
  return p;
}

    var k=keyOf(d);
    if(S.done[k]) n++;
    else if(d.getDay()!==0) break;                     // a skipped Sunday (rest) never breaks the streak
    d=addDays(d,-1);
  }
  return n;
}

/* ---------- render ---------- */
var $=function(id){return document.getElementById(id);};
var TODAY, PLAN;
function render(){
  TODAY=noon(now()); PLAN=planFor(TODAY);
  var p=PLAN, k=keyOf(TODAY);
  var btn = p.sheet
    ? '<button class="big" id="inputBtn">'+esc(p.btn)+' <span class="arrow">→</span></button>'
    : '<a class="big" id="inputBtn" href="'+esc(p.url)+'" target="_blank" rel="noopener">'+esc(p.btn)+' <span class="arrow">↗</span></a>';
  $("today").innerHTML =
    '<div class="today-head"><div><div class="dayname">'+DOW[p.dow]+'</div><div class="date">'+MONTHS[TODAY.getMonth()]+' '+TODAY.getDate()+', '+TODAY.getFullYear()+'</div></div>'+
    '<span class="chip m-'+p.mode+'">'+MODE_LABEL[p.mode]+'</span></div>'+
    '<div class="headline">'+esc(p.title)+'</div>'+
    '<div class="step"><div class="steplabel" id="lblIn"><span class="n">1</span>10 min · Input</div>'+
      '<p class="steptext">'+esc(p.input)+'</p>'+(p.pickHtml?'<div class="pick">'+p.pickHtml+'</div>':'')+btn+
      (p.alt?'<div class="sub">'+esc(p.alt)+'</div>':'')+'</div>'+
    '<div class="step"><div class="steplabel" id="lblOut"><span class="n">2</span>20 min · Make</div>'+
      '<p class="steptext">'+esc(p.output)+'</p></div>';
  if(p.sheet) $("inputBtn").onclick=function(){ openSheet(); };
  $("timerCard").style.opacity = p.mode==="rest" ? ".72" : "1";

  var rec=S.done[k];
  $("note").placeholder=p.notePh;
  if(document.activeElement!==$("note")) $("note").value = rec&&rec.note ? rec.note : ($("note").dataset.draftFor===k ? $("note").value : "");
  $("note").dataset.draftFor=k;
  $("doneBtn").className="done"+(rec?" is-done":"");
  $("doneBtn").textContent = rec ? (p.mode==="rest"?"✓ Rested. See you Monday":"✓ Done today. Nice.") : (p.mode==="rest"?"Mark today rested":"Done today");
  $("undoBtn").hidden=!rec;

  var n=streak(TODAY);
  $("streakN").textContent=n; $("streakL").textContent = n===1?"day":"days";

  var h="";
  for(var i=6;i>=0;i--){
    var d=addDays(TODAY,-i), dk=keyOf(d), done=!!S.done[dk], isT=i===0;
    h+='<div class="hd'+(isT?' today':'')+'"><div class="dot'+(done?' ok':'')+(d.getDay()===0&&!done?' rest':'')+(isT&&!done?' today':'')+'" title="'+dk+'">'+(done?'✓':'')+'</div>'+DOW[d.getDay()].charAt(0)+'</div>';
  }
  $("hist").innerHTML=h;
  renderWeek();
}
function renderWeek(){
  var mon=mondayOf(TODAY), out="";
  var sun=addDays(mon,6);
  $("sheetTitle").textContent="Week of "+MONTHS[mon.getMonth()]+" "+mon.getDate();
  for(var i=0;i<7;i++){
    var d=addDays(mon,i), p=planFor(d), k=keyOf(d), rec=S.done[k], isT=k===keyOf(TODAY), sp=shortPick(p);
    out+='<div class="wd'+(isT?' today':'')+'"><div class="h"><div><b>'+DOW[p.dow].slice(0,3)+'</b><span class="d">'+MONTHS[d.getMonth()]+' '+d.getDate()+(isT?' · today':'')+'</span>'+(rec?' <span class="ck">✓</span>':'')+'</div>'+
      '<span class="chip m-'+p.mode+'">'+MODE_LABEL[p.mode]+'</span></div>'+
      '<p><strong>'+esc(p.title)+'</strong>'+(sp&&!p.manga?' · '+esc(sp):'')+'</p>'+
      '<p>In: '+esc(p.input)+'</p><p>Out: '+esc(p.output)+'</p>'+
      (rec&&rec.note?'<div class="mine">You noted: '+esc(rec.note)+'</div>':'')+'</div>';
  }
  $("week").innerHTML=out;
}

/* ---------- sheet ---------- */
function openSheet(){ renderWeek(); $("scrim").classList.add("open"); $("sheet").classList.add("open"); }
function closeSheet(){ $("scrim").classList.remove("open"); $("sheet").classList.remove("open"); }
$("peekBtn").onclick=openSheet; $("closeSheet").onclick=closeSheet; $("scrim").onclick=closeSheet;
document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeSheet(); });

/* ---------- done ---------- */
function toast(t){ var el=$("toast"); el.textContent=t; el.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(function(){el.classList.remove("show");},2200); }
$("doneBtn").onclick=function(){
  var k=keyOf(noon(now()));
  if(S.done[k]){ S.done[k].note=$("note").value.trim(); save(); render(); toast("Saved"); return; }
  S.done[k]={t:Date.now(), note:$("note").value.trim()}; save(); render();
  try{ navigator.vibrate&&navigator.vibrate(30); }catch(e){}
  var n=streak(noon(now())); toast(n>1? "🔥 "+n+" day streak":"Finished. Rough counts.");
};
$("undoBtn").onclick=function(){ var k=keyOf(noon(now())); delete S.done[k]; save(); render(); };
$("note").addEventListener("change",function(){ var k=keyOf(noon(now())); if(S.done[k]){ S.done[k].note=this.value.trim(); save(); renderWeek(); } });

/* ---------- timer ---------- */
var IN=600, OUT=1200, TOTAL=IN+OUT, ac=null, wake=null, lastPhase=null;
S.timer=S.timer||null; // {acc: ms elapsed before current run, run: timestamp started or null}
function elapsed(){ var t=S.timer; if(!t) return 0; return (t.acc||0)+(t.run?Date.now()-t.run:0); }
function phaseOf(sec){ return !S.timer?"idle":sec<IN?"in":sec<TOTAL?"out":"end"; }
function unlockAudio(){
  try{ if(!ac){ var C=window.AudioContext||window.webkitAudioContext; if(C) ac=new C(); }
    if(ac&&ac.state==="suspended") ac.resume();
    if(ac){ var b=ac.createBuffer(1,1,22050), s=ac.createBufferSource(); s.buffer=b; s.connect(ac.destination); s.start(0); } }catch(e){}
}
function chime(final){
  try{
    if(ac){ var t0=ac.currentTime+.02, notes=final?[523.25,659.25,783.99]:[659.25,880];
      notes.forEach(function(f,i){ var o=ac.createOscillator(), g=ac.createGain(); o.type="sine"; o.frequency.value=f;
        var st=t0+i*.22; g.gain.setValueAtTime(0.0001,st); g.gain.exponentialRampToValueAtTime(0.22,st+.03); g.gain.exponentialRampToValueAtTime(0.0001,st+1.6);
        o.connect(g); g.connect(ac.destination); o.start(st); o.stop(st+1.7); }); }
  }catch(e){}
  try{ navigator.vibrate&&navigator.vibrate(final?[120,80,120,80,200]:[150,90,150]); }catch(e){}
}
function requestWake(){ try{ if(navigator.wakeLock&&!wake) navigator.wakeLock.request("screen").then(function(w){wake=w; w.addEventListener("release",function(){wake=null;});}).catch(function(){}); }catch(e){} }
function releaseWake(){ try{ wake&&wake.release(); }catch(e){} wake=null; }
function fmt(s){ s=Math.max(0,Math.ceil(s)); return pad(Math.floor(s/60))+":"+pad(s%60); }
function tick(){
  var sec=elapsed()/1000, ph=phaseOf(sec), running=!!(S.timer&&S.timer.run);
  if(lastPhase && ph!==lastPhase && running){
    if(ph==="out"){ chime(false); toast("10 min up. Now make something."); }
    if(ph==="end"){ chime(true); toast("Time! Finish it, even if rough."); }
  }
  if(ph==="end" && running){ S.timer.acc=TOTAL*1000; S.timer.run=null; save(); releaseWake(); running=false; }
  lastPhase=ph;
  var rem, frac, small, phase, desc;
  if(ph==="idle"){ rem=IN; frac=0; small="input"; phase="Ready when you are"; desc="10 min input, then 20 min making."; }
  else if(ph==="in"){ rem=IN-sec; frac=sec/IN; small="input"; phase="Input · take it in"; desc="Then 20:00 of making starts automatically."; }
  else if(ph==="out"){ rem=TOTAL-sec; frac=(sec-IN)/OUT; small="make"; phase="Make · 20 minutes"; desc="Don't polish. Keep going."; }
  else { rem=0; frac=1; small="done"; phase="Time's up 🎉"; desc="Wrap it up and tap Done today."; }
  $("tTime").textContent=fmt(rem); $("tSmall").textContent=small;
  $("arc").style.strokeDashoffset=String(301.6*(1-Math.min(1,frac)));
  $("arc").style.stroke = ph==="out"?"var(--write)":ph==="end"?"var(--ok)":"var(--accent)";
  $("tPhase").textContent = (S.timer&&!running&&ph!=="end") ? "Paused" : phase; $("tDesc").textContent=desc;
  $("tStart").textContent = ph==="idle"?"Start": ph==="end"?"Again": running?"Pause":"Resume";
  $("tReset").hidden = ph==="idle";
  var li=$("lblIn"), lo=$("lblOut"); if(li){ li.classList.toggle("on",ph==="in"); lo.classList.toggle("on",ph==="out"); }
  document.title = (running? fmt(rem)+" · ":"")+"10 in, 20 out";
}
$("tStart").onclick=function(){
  unlockAudio();
  var sec=elapsed()/1000, ph=phaseOf(sec);
  if(ph==="idle"||ph==="end"){ S.timer={acc:0,run:Date.now()}; lastPhase="in"; requestWake(); try{navigator.vibrate&&navigator.vibrate(20);}catch(e){} }
  else if(S.timer.run){ S.timer.acc=elapsed(); S.timer.run=null; releaseWake(); }
  else { S.timer.run=Date.now(); requestWake(); }
  save(); tick();
};
$("tReset").onclick=function(){ S.timer=null; save(); releaseWake(); lastPhase=null; tick(); };
document.addEventListener("visibilitychange",function(){ if(!document.hidden){ if(S.timer&&S.timer.run) requestWake(); render(); tick(); } });

/* ---------- manifest (built at runtime so start_url is absolute) ---------- */
try{
  var base=location.href.split("#")[0].split("?")[0];
  var man={name:"10 in, 20 out",short_name:"10 in 20 out",description:"Daily creativity routine",start_url:base,scope:base.replace(/[^\/]*$/,""),display:"standalone",
    background_color:"#1c1512",theme_color:"#1c1512",icons:[{src:ICON,sizes:"192x192",type:"image/png",purpose:"any"}]};
  $("manifest").href="data:application/manifest+json,"+encodeURIComponent(JSON.stringify(man));
}catch(e){}

/* ---------- boot ---------- */
render(); lastPhase=phaseOf(elapsed()/1000); tick();
setInterval(tick,250);
var lastKey=keyOf(noon(now()));
setInterval(function(){ var k=keyOf(noon(now())); if(k!==lastKey){ lastKey=k; render(); } },30000);
window.__dc={planFor:planFor, keyOf:keyOf, MANGA:MANGA, READS:READS};
})();
</script>
</body>
